<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ahmed Ouazzani's portfolio of business intelligence, data analytics, and applied machine learning projects. Based in Ottawa, Canada."
    />
    <meta name="theme-color" content="#122c36" />
    <title>
      {% block title %}Ahmed Ouazzani | Data &amp; BI Portfolio{% endblock %}
    </title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='images/favicon.svg') }}"
      type="image/svg+xml"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="container navigation" aria-label="Main navigation">
        <a class="brand" href="#home" aria-label="Ahmed Ouazzani, home"
          ><span class="brand-mark" aria-hidden="true">ao.</span
          ><span
            >Ahmed Ouazzani<span class="brand-subtitle"
              >Data &amp; Business Intelligence</span
            ></span
          ></a
        >
        <ul class="nav-links">
          <li><a href="#projects">Projects</a></li>
          <li><a href="#about">About</a></li>
          <li>
            <a class="nav-contact" href="#contact"
              >Get in touch <span aria-hidden="true">↗</span></a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer class="site-footer container">
      <p>© {{ current_year }} Ahmed Ouazzani</p>
      <div class="footer-links">
        <a
          href="https://github.com/AhmedOT22"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub <span class="sr-only">(opens in a new tab)</span> ↗</a
        ><a
          href="https://www.linkedin.com/in/ahmed-ouazzani-5b078b205/"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn <span class="sr-only">(opens in a new tab)</span> ↗</a
        ><a href="#home">Back to top ↑</a>
      </div>
    </footer>
  </body>
</html>
